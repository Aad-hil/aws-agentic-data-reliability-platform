<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Agentic Data Reliability Platform architecture</title>
  <desc id="desc">Portfolio architecture showing S3 input, EventBridge, Lambda, deterministic reliability checks, specialized agents powered by Amazon Bedrock, S3 reports, Athena and Tableau, with CloudWatch observability and SQS failure handling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="40" y="32" width="1320" height="836" rx="24" fill="white" stroke="#dbe3ec" stroke-width="2"/>

  <text x="700" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">AWS Agentic Data Reliability Platform</text>
  <text x="700" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Evidence-first pipeline for detecting, diagnosing, explaining and recommending safe remediation</text>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="85" y="165" width="180" height="92" rx="16" fill="#eef6ff" stroke="#5b9bd5" stroke-width="2"/>
    <rect x="315" y="165" width="180" height="92" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="545" y="165" width="180" height="92" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <rect x="775" y="145" width="300" height="132" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect x="1125" y="165" width="190" height="92" rx="16" fill="#eef6ff" stroke="#5b9bd5" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="175" y="201" font-size="19" font-weight="700" fill="#111827">Amazon S3</text>
    <text x="175" y="226" font-size="14" fill="#475569">input/*.csv</text>
    <text x="175" y="246" font-size="12" fill="#64748b">source data</text>

    <text x="405" y="201" font-size="19" font-weight="700" fill="#111827">EventBridge</text>
    <text x="405" y="226" font-size="14" fill="#475569">ObjectCreated event</text>
    <text x="405" y="246" font-size="12" fill="#64748b">event-driven trigger</text>

    <text x="635" y="201" font-size="19" font-weight="700" fill="#111827">AWS Lambda</text>
    <text x="635" y="226" font-size="14" fill="#475569">reliability runtime</text>
    <text x="635" y="246" font-size="12" fill="#64748b">orchestration boundary</text>

    <text x="925" y="179" font-size="19" font-weight="700" fill="#166534">Deterministic + Agentic Analysis</text>
    <text x="925" y="207" font-size="14" fill="#475569">Reliability Engine → Multi-Agent Orchestrator</text>
    <text x="925" y="238" font-size="14" font-weight="700" fill="#166534">Detection • RCA • Recommendation</text>
    <text x="925" y="261" font-size="12" fill="#64748b">Amazon Bedrock powers model inference</text>

    <text x="1220" y="201" font-size="19" font-weight="700" fill="#111827">Amazon S3</text>
    <text x="1220" y="226" font-size="14" fill="#475569">reports/*.json</text>
    <text x="1220" y="246" font-size="12" fill="#64748b">evidence + insights</text>
  </g>

  <g stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="265" y1="211" x2="315" y2="211"/>
    <line x1="495" y1="211" x2="545" y2="211"/>
    <line x1="725" y1="211" x2="775" y2="211"/>
    <line x1="1075" y1="211" x2="1125" y2="211"/>
  </g>

  <!-- Analytical path -->
  <g filter="url(#shadow)">
    <rect x="420" y="365" width="250" height="100" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="745" y="365" width="250" height="100" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="1070" y="365" width="220" height="100" rx="16" fill="#eef6ff" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="545" y="402" font-size="19" font-weight="700" fill="#111827">Tableau-ready extracts</text>
    <text x="545" y="428" font-size="14" fill="#475569">dataset_runs • findings</text>
    <text x="545" y="449" font-size="14" fill="#475569">agent_insights</text>

    <text x="870" y="402" font-size="19" font-weight="700" fill="#5b21b6">Amazon Athena</text>
    <text x="870" y="428" font-size="14" fill="#475569">reliability_ui</text>
    <text x="870" y="449" font-size="12" fill="#64748b">normalized analytical views</text>

    <text x="1180" y="402" font-size="19" font-weight="700" fill="#111827">Tableau</text>
    <text x="1180" y="428" font-size="14" fill="#475569">read-only BI layer</text>
    <text x="1180" y="449" font-size="12" fill="#64748b">Overview + Investigation</text>
  </g>

  <g stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M1220 257 V315 H545 V365"/>
    <line x1="670" y1="415" x2="745" y2="415"/>
    <line x1="995" y1="415" x2="1070" y2="415"/>
  </g>
  <text x="1030" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">read-only transformation / export</text>

  <!-- Operations path -->
  <g filter="url(#shadow)">
    <rect x="110" y="575" width="285" height="100" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <rect x="465" y="575" width="285" height="100" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="820" y="575" width="350" height="100" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="252" y="612" font-size="19" font-weight="700" fill="#111827">Amazon CloudWatch</text>
    <text x="252" y="638" font-size="14" fill="#475569">logs • metrics • dashboard</text>
    <text x="252" y="659" font-size="12" fill="#64748b">operational observability</text>

    <text x="607" y="612" font-size="19" font-weight="700" fill="#991b1b">SQS failure destination</text>
    <text x="607" y="638" font-size="14" fill="#475569">Lambda async failures</text>
    <text x="607" y="659" font-size="12" fill="#64748b">after bounded retries / investigation</text>

    <text x="995" y="612" font-size="19" font-weight="700" fill="#166534">Safety boundary</text>
    <text x="995" y="638" font-size="14" fill="#475569">recommendations are advisory</text>
    <text x="995" y="659" font-size="12" fill="#64748b">automatic destructive mutation disabled</text>
  </g>

  <g stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M1220 257 V520 H252 V575"/>
    <path d="M1220 257 V520 H607 V575"/>
    <path d="M925 277 V520 H995 V575"/>
  </g>

  <!-- Principles -->
  <rect x="110" y="740" width="1180" height="76" rx="14" fill="#f8fafc" stroke="#dbe3ec"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="700" y="769" font-size="15" font-weight="700" fill="#111827">Portfolio design principles</text>
    <text x="700" y="794" font-size="13" fill="#475569">Evidence first • Specialized agents • Typed handoffs • Least-privilege IAM • Human-reviewed remediation • AWS-independent tests</text>
  </g>
</svg>
