AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS execution boundary for the agentic data reliability platform.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        REPORT_PREFIX: reports/
        BEDROCK_MODEL_ID: !Ref BedrockModelId
Parameters:
  BedrockModelId:
    Type: String
    Description: Bedrock model ID enabled in the deployment region.
Resources:
  ReliabilityBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  ReliabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src.lambda_handler.handler
      Policies:
        - S3ReadPolicy: {BucketName: !Ref ReliabilityBucket}
        - S3WritePolicy: {BucketName: !Ref ReliabilityBucket}
        - Statement:
            - Effect: Allow
              Action: bedrock:Converse
              Resource: "*"
      Events:
        InputUpload:
          Type: S3
          Properties:
            Bucket: !Ref ReliabilityBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: input/
Outputs:
  ReliabilityBucketName:
    Value: !Ref ReliabilityBucket
  ReliabilityFunctionName:
    Value: !Ref ReliabilityFunction
