AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS execution boundary for the agentic data reliability platform.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        REPORT_PREFIX: reports/
        BEDROCK_MODEL_ID: !Ref BedrockModelId
Parameters:
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Bedrock inference profile ID enabled in the deployment region.
  LogRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 3653
Resources:
  ReliabilityBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  ReliabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src.lambda_handler.handler
      Policies:
        - S3ReadPolicy: {BucketName: !Ref ReliabilityBucket}
        - S3WritePolicy: {BucketName: !Ref ReliabilityBucket}
        - Statement:
            - Effect: Allow
              Action: bedrock:Converse
              Resource: "*"
      Events:
        InputUpload:
          Type: S3
          Properties:
            Bucket: !Ref ReliabilityBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: input/
      Logging:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Tags:
        Project: agentic-data-reliability
        Component: reliability-runtime
  ReliabilityLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReliabilityFunction}
      RetentionInDays: !Ref LogRetentionDays
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-reliability
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Lambda Invocations","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/Lambda","Invocations","FunctionName","${ReliabilityFunction}"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Lambda Errors","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/Lambda","Errors","FunctionName","${ReliabilityFunction}"]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda Duration","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/Lambda","Duration","FunctionName","${ReliabilityFunction}"]]}}
          ]
        }
Outputs:
  ReliabilityBucketName: {Value: !Ref ReliabilityBucket}
  ReliabilityFunctionName: {Value: !Ref ReliabilityFunction}
  ReliabilityLogGroupName: {Value: !Ref ReliabilityLogGroup}
  DashboardName: {Value: !Ref Dashboard}
